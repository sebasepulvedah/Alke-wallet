<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<main class="app">

    <div class="mb-3">
        <h2>Crear usuario</h2>
        <small class="small-muted">Registro de nueva cuenta</small>
    </div>

    <section class="card-glass card-pad">
        <label class="small-muted mb-1">Usuario</label>
        <input id="user" class="form-control mb-3" placeholder="Ej: Andrés">

        <label class="small-muted mb-1">Contraseña</label>
        <input id="pass" type="password" class="form-control mb-3" placeholder="Mínimo 4 caracteres">

        <button id="registerBtn" class="btn btn-accent w-100">Registrarse</button>
        <div id="msg" class="alert d-none mt-3"></div>
        <div class="text-center mt-3">
        <a href="login.html" class="small-muted">Volver al login</a>
        </div>
    </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/register.js"></script>
<script src="js/ui.js"></script> 
</body>
</html>
