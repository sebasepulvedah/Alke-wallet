<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Menú</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="menu.html">Alke Wallet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
                <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar dinero</a></li>
                <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
                <li class="nav-item"><a id="logoutBtn" href="login.html" class="nav-link text-danger">Salir</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="app">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Menú</h2>
            <small class="small-muted">
            Usuario: <b id="userTxt"></b>
            </small>
        </div>
    </div>


    <!-- Tarjeta saldo -->
    <section class="balance-card mb-3">
        <div class="balance-title">Saldo disponible</div>
        <div id="saldoTxt" class="balance-amount">$0</div>
    </section>

    <!-- Acciones -->
    <section class="card-glass card-pad">
        <a href="deposit.html" class="btn btn-accent w-100 mb-2">Depositar</a>
        <a href="sendmoney.html" class="btn btn-soft w-100 mb-2">Enviar dinero</a>
        <a href="transactions.html" class="btn btn-soft w-100">Últimos movimientos</a>
    </section>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- El usuario logueado se guarda en localStorage y
se recupera dinámicamente en el menú principal para mostrar el estado de sesión -->
<script>
    const currentUser = localStorage.getItem("currentUser");
    const users = JSON.parse(localStorage.getItem("users") || "[]");
    const me = users.find(u => u.user === currentUser);

    $("#saldoTxt").text("$" + (me?.saldo || 0).toLocaleString("es-CL"));
</script>
<script src="js/user.js"></script>   
<script src="js/ui.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
