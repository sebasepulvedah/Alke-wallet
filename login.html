<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="app">
        <div class="text-center mb-3">
            <h2 class="mb-1">Alke Wallet</h2>
            <div class="small-muted">Ingresar para continuar</div>
        </div>  
        <section class="card-glass card-pad">
            <label class="small-muted mb-1">Usuario</label>
            <input id="user" class="form-control mb-3" placeholder="admin">
            <label class="small-muted mb-1">Contraseña</label>
            <input id="pass" type="password" class="form-control mb-3" placeholder="1234">
            <button id="loginBtn" class="btn btn-accent w-100">Ingresar</button>
            <div class="text-center mt-3">
                <a href="register.html" class="small-muted">¿No tienes cuenta? Registrarte aquí</a>
            </div>
            <div class="small-muted text-center mt-3">
                    Demo: <b>seba</b> / <b>1234</b> <br>
                            <b>flor</b> / <b>1234</b>
            </div>
        </section>
    </main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/login.js"></script>
<script src="js/ui.js"></script> 
</body>
</html>
