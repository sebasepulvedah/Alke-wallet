<!DOCTYPE html>
<html lang="es">
<head>

<title>Depósito</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="menu.html">Alke Wallet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
            <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar dinero</a></li>
            <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="login.html">Salir</a></li>
            </ul>
        </div>
        </div>
</nav>

    <main class="app">
        <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Depósito</h3>
            <a href="menu.html" class="btn btn-soft btn-sm">Volver</a>
        </div>

        <section class="balance-card mb-3">
        <div class="balance-title">Saldo actual</div>
        <div id="saldoTxt" class="balance-amount">$0</div>
        </section>

        <section class="card-glass card-pad">
        <label class="small-muted mb-1">Monto a depositar</label>
        <input id="monto" type="number" class="form-control mb-3" placeholder="Ej: 5000">

        <button id="depositar" class="btn btn-accent w-100">Depositar</button>

        <!-- Mensaje opcional -->
        <div id="msg" class="alert d-none mt-3"></div>
        </section>
    </main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/user.js"></script>   
<script src="js/deposit.js"></script>
<script src="js/ui.js"></script> 

    <script>
        // Mostrar saldo al cargar
        const saldo = Number(localStorage.getItem("saldo") || 0);
        $("#saldoTxt").text("$" + saldo.toLocaleString("es-CL"));
    </script>


<!-- Bootstrap JS (para que funcione el botón hamburguesa del navbar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
